[global.config]
  as = 64512
  router-id = <router_id_addr>
  # En conteneur bridge, l'IP hôte 203.0.113.1 n'existe pas dans le
  # namespace réseau du conteneur → bind impossible. On écoute donc sur
  # toutes les interfaces IPv4 du conteneur (0.0.0.0 et pas de liste vide :
  # sans IPv6 dans le conteneur, le bind [::]:179 échouerait) ;
  # l'exposition côté hôte se fait via le mapping de ports du compose
  # (1790:179, 50052:50051).
  # local-address-list = [<router_id_addr>]
  local-address-list = ["0.0.0.0"]
  # port = 180
# [global.listen-port]

[[neighbors]]
  [neighbors.config]
    peer-as = 64512
    neighbor-address = "192.168.100.71"

    [neighbors.apply-policy.config]
      import-policy-list = ["allow-all"]
      export-policy-list = ["deny-all"]

    [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
     afi-safi-name = "ls"

     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "ipv4-unicast"
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "ipv6-unicast"
         # --- VPNv4 ---
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "l3vpn-ipv4-unicast"
    #      # --- VPNv6 ---
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "l3vpn-ipv6-unicast"
#  Activer BGP Labeled-Unicast IPv4
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "ipv4-labelled-unicast"


    [[vrfs]]
      [vrfs.config]
        name = "client-vrf"
        rd = "64512:300007777"
        # both-rt-list = ["64512:3000070"]
        import-rt-list = ["64512:3000070"]
        export-rt-list = ["64512:3000070"]

   # # --- VPNv6 (si nécessaire) ---
   # [[neighbors.afi-safis]]
   #   [neighbors.afi-safis.config]
   #     afi-safi-name = "l3vpn-ipv6-unicast"
    #  [neighbors.transport.config]
    #    local-address = "203.0.113.30"


[[neighbors]]
  [neighbors.config]
    peer-as = 65000
    neighbor-address = "192.168.100.114"
    [neighbors.ebgp-multihop.config]
      enabled = true
    ## PE-ROUTER-2
    [neighbors.apply-policy.config]
      import-policy-list = ["allow-all"]
      export-policy-list = ["deny-all"]
      # default-import-policy = "accept-route"
      # default-export-policy = "deny-route"

    [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
     afi-safi-name = "ls"

     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "ipv4-unicast"


     # [[neighbors.afi-safis]]
     #   [neighbors.afi-safis.config]
     #     afi-safi-name = "ipv6-unicast"
         # --- VPNv4 ---
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "l3vpn-ipv4-unicast"

 # Activer BGP Labeled-Unicast IPv4
     [[neighbors.afi-safis]]
       [neighbors.afi-safis.config]
         afi-safi-name = "ipv4-labelled-unicast"


      [[vrfs]]
        [vrfs.config]
          name = "client-vrf_lab"
          rd = "64512:300007777"
          # both-rt-list = ["64512:3000070"]
          import-rt-list = ["64512:3000070"]
          export-rt-list = ["64512:3000070"]

[[neighbors]]
 [neighbors.config]
   peer-as = 64512
   neighbor-address = "203.0.113.10"
   ## PROD
   [neighbors.apply-policy.config]
      import-policy-list = ["allow-all"]
      export-policy-list = ["deny-all"]

   [[neighbors.afi-safis]]
   [neighbors.afi-safis.config]
     afi-safi-name = "ls"


[[neighbors]]
 [neighbors.config]
   peer-as = 64512
   neighbor-address = "203.0.113.20"
   ## PROD FLOW SPEC (anti-DDoS)
  #  [neighbors.apply-policy.config]
  #     import-policy-list = ["allow-all"]
  #     export-policy-list = ["deny-all"]
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-flowspec"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-flowspec"
