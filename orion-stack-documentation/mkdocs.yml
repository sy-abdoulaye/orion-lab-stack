          - Receiver (FastAPI): services/netbox-neo4j-sync/receiver.md
          - Reconciler: services/netbox-neo4j-sync/reconciler.md
          - CLI d'administration: services/netbox-neo4j-sync/admin-cli.md
          - Modèle de données: services/netbox-neo4j-sync/data-model.md
          - Configuration: services/netbox-neo4j-sync/configuration.md
          - Sécurité: services/netbox-neo4j-sync/security.md
          - Déploiement: services/netbox-neo4j-sync/deployment.md
          - Dépannage: services/netbox-neo4j-sync/troubleshooting.md
      - gobgp-neo4j-sync:
          - Vue d'ensemble: services/gobgp-neo4j-sync/index.md
          - Architecture: services/gobgp-neo4j-sync/architecture.md
          - Modèle de données: services/gobgp-neo4j-sync/data-model.md
          - Configuration: services/gobgp-neo4j-sync/configuration.md
          - Déploiement: services/gobgp-neo4j-sync/deployment.md
