site_name: Orion Stack — Documentation
site_description: >-
  Documentation de la plateforme Orion — organisée par service : Neo4j, ClickHouse,
  netbox-neo4j-sync, gobgp-neo4j-sync, gobgp, vector et NetBox.
site_author: Backbone Solutions / Validation
# Requis par `navigation.instant` (chargement type SPA). Le chemin (racine `/`) est
# ce qui compte : à l'exécution, Material s'appuie sur l'origine du navigateur, donc
# l'accès via n'importe quelle IP de l'hôte fonctionne (host/port ici sans importance).
site_url: http://localhost:8090/
docs_dir: docs

theme:
  name: material
  language: fr
  # Désactive Google Fonts : le navigateur n'a pas d'accès Internet -> évite un
  # chargement bloquant. Material utilise alors la pile de polices système.
  font: false
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/git-alt
  features:
    # Navigation instantanée (type SPA) : pas de rechargement complet entre pages.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

extra_css:
  - assets/extra.css

# Mermaid hébergé en local (définit le global `mermaid`) : Material détecte le
# global et n'appelle donc PAS le CDN unpkg.com -> rendu des diagrammes hors-ligne.
extra_javascript:
  - assets/js/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Rend les icônes `:material-...:` / `:octicons-...:` (utilisées dans les cards).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

