# Serveur nginx de la documentation (remplace le default.conf de l'image).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression gzip (gros assets : mermaid.min.js, CSS/JS Material) ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # ── Cache ──
    # Par défaut : revalidation systématique. Évite qu'un navigateur garde une
    # ancienne version du HTML après un redéploiement (cause de comportements
    # obsolètes, ex. navigation instantanée non prise en compte).
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Les assets Material sont versionnés par hash de contenu -> cache long sûr.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
